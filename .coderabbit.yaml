# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"

reviews:
  path_filters:
    - "src/**"
    - "tests/**"
    - "examples/**"
    - "skills/**"
    - "Cargo.toml"
    - "pyproject.toml"
    - "README.md"
    - "LICENSE-*"
    - "clippy.toml"
    - "deny.toml"
    - "rustfmt.toml"
    - "rust-toolchain.toml"
    - ".github/**"
    - "check.ps1"
    - "CLAUDE.md"
    - "specs/**/*.md"
    - "bench/**"
    - "!bench/results/**/runs/**"
    - "!bench/results/**/judge/**"
    - "!bench/results/repeat/**"
    - "!bench/results/wordings/**"
    - "!bench/results/**/pool.json"
    - "!bench/results/**/ratings.json"
    - "!bench/results/licenses.json"
    - "!bench/results/**/*.png"
    - "!bench/uv.lock"
    - "!Cargo.lock"

  path_instructions:
    - path: "src/**/*.rs"
      instructions: >-
        Clippy fails CI on the lints in Cargo.toml; skip what it checks and
        focus on the CLAUDE.md rules a linter can't.
    - path: "{Cargo.toml,clippy.toml,deny.toml,rustfmt.toml,rust-toolchain.toml}"
      instructions: >-
        Flag any change that weakens a lint, a threshold or a deny rule.
    - path: "skills/**/SKILL.md"
      instructions: >-
        Flag any command, flag or output shape that does not match the CLI.
    - path: "README.md"
      instructions: >-
        Flag any command, flag or output shape that does not match the CLI, and
        any relative link (the README is also the PyPI description).
    - path: "bench/**/*.py"
      instructions: >-
        Ruff (all rules) and pyright strict fail bench.yml; skip what they check.
        Focus on the CLAUDE.md rules a linter can't, and on anything that could
        bias the measurement: counting, sampling, thresholds chosen on test
        queries, or one contender treated differently from another.
    - path: "bench/README.md"
      instructions: >-
        Flag any number or setting that does not match the code or
        bench/results/, and any choice that could favour a tool without a
        stated reason.

  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false

  pre_merge_checks:
    docstrings:
      mode: "off"

  finishing_touches:
    docstrings:
      enabled: false
