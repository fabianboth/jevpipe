[package]
name = "jevpipe"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "A Unix pipe for typed decisions: stream records in, get calibrated decisions out."
publish = false

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"

[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
wildcard_enum_match_arm = "warn"
allow_attributes = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
