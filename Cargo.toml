[package]
name = "jevpipe"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "A Unix pipe for typed decisions: stream records in, get calibrated decisions out."
publish = false

[dependencies]
backon = "1.6.0"
clap = { version = "4.6.7", features = ["derive"] }
encoding_rs = "0.8.42"
futures = "0.3.34"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "fs", "io-util"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
wiremock = "0.6.5"

[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
wildcard_enum_match_arm = "warn"
allow_attributes = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
